<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7eb8e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Flouzeo — notez vos dépenses au quotidien" />
    <link rel="manifest" href="manifest.webmanifest?v=3" />
    <link rel="icon" href="icons/piggy.svg?v=3" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/piggy-192.png?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Flouzeo</title>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <img class="brand-mark" src="icons/piggy-192.png?v=3" width="28" height="28" alt="" />
          <h1>Flouzeo</h1>
        </div>
        <div class="month-nav" role="group" aria-label="Mois">
          <button type="button" class="icon-btn" id="prev-month" aria-label="Mois précédent">
            ‹
          </button>
          <p class="month-label" id="month-label"></p>
          <button type="button" class="icon-btn" id="next-month" aria-label="Mois suivant">
            ›
          </button>
        </div>
      </header>

      <section class="total-panel" aria-live="polite">
        <p class="total-label">Total du mois</p>
        <p class="total-value" id="month-total">0,00 €</p>
      </section>

      <main class="content">
        <section class="block" aria-labelledby="var-title">
          <h2 id="var-title">Charges variables</h2>
          <p class="hint">Touchez une catégorie pour ajouter une dépense</p>
          <ul class="cat-list" id="variable-list"></ul>
        </section>

        <section class="block block-fixed" aria-labelledby="fix-title">
          <h2 id="fix-title">Charges fixes</h2>
          <p class="hint">Montants reportés chaque mois — modifiables</p>
          <ul class="cat-list" id="fixed-list"></ul>
        </section>
      </main>
    </div>

    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <div
      class="sheet"
      id="sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sheet-title"
      hidden
    >
      <div class="sheet-handle" aria-hidden="true"></div>
      <h3 id="sheet-title"></h3>
      <p class="sheet-sub" id="sheet-sub"></p>

      <label class="field">
        <span>Montant (€)</span>
        <input
          id="amount-input"
          type="number"
          inputmode="decimal"
          min="0"
          step="0.01"
          placeholder="0,00"
          autocomplete="off"
        />
      </label>

      <label class="field" id="note-field">
        <span>Note (optionnel)</span>
        <input id="note-input" type="text" maxlength="80" placeholder="Ex. Carrefour" />
      </label>

      <div class="sheet-actions">
        <button type="button" class="btn btn-ghost" id="sheet-cancel">Annuler</button>
        <button type="button" class="btn btn-primary" id="sheet-save">Enregistrer</button>
      </div>

      <div class="entries" id="entries" hidden>
        <h4>Ce mois</h4>
        <ul id="entries-list"></ul>
      </div>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
